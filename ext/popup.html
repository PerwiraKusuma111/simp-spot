<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotify Mobile Mode</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{min-width:296px;width:100%;max-width:420px;margin:0 auto;background:#121212;color:#fff;padding:14px}
  .hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .logo{width:28px;height:28px;border-radius:50%;background:#1db954;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:14px;flex:none}
  .ttl{font-size:15px;font-weight:800;letter-spacing:-.2px}
  .sub{font-size:11px;color:#9e9e9e;margin-top:1px}
  .card{background:#1b1b1b;border:1px solid #282828;border-radius:12px;padding:11px 12px;margin-bottom:10px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .row+.row{margin-top:10px;padding-top:10px;border-top:1px solid #262626}
  .lbl{font-size:12.5px;font-weight:600;color:#ececec}
  .hint{font-size:10.5px;color:#8c8c8c;margin-top:2px;line-height:1.3}
  .val{font-size:14px;font-weight:800;color:#1db954;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;margin:9px 0 8px;accent-color:#1db954;cursor:pointer}
  .presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .pbtn{background:#262626;color:#d6d6d6;border:1px solid #333;border-radius:8px;padding:6px 0;font-size:11.5px;font-weight:700;cursor:pointer}
  .pbtn.act{background:#1db954;border-color:#1db954;color:#000}
  .sw{position:relative;width:40px;height:22px;flex:none}
  .sw input{opacity:0;width:0;height:0}
  .sl{position:absolute;inset:0;background:#3a3a3a;border-radius:999px;cursor:pointer;transition:.16s}
  .sl:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.16s}
  .sw input:checked+.sl{background:#1db954}
  .sw input:checked+.sl:before{transform:translateX(18px)}
  .btn{width:100%;border:0;border-radius:10px;padding:10px;background:#1db954;color:#000;font-size:13px;font-weight:800;cursor:pointer}
  .btn:active{opacity:.85}
  .st{margin-top:7px;font-size:11px;color:#1db954;text-align:center;min-height:14px}
</style>
</head>
<body>
  <div class="hdr">
    <div class="logo">S</div>
    <div>
      <div class="ttl">Spotify Mobile Mode</div>
      <div class="sub">open.spotify.com</div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <div class="lbl">Aktifkan Mode Mobile</div>
        <div class="hint">Ubah web desktop jadi tampilan HP</div>
      </div>
      <label class="sw"><input id="enabled" type="checkbox"><span class="sl"></span></label>
    </div>
    <div class="row">
      <div>
        <div class="lbl">Desktop UA Otomatis</div>
        <div class="hint">Biar bisa play penuh tanpa Situs Desktop</div>
      </div>
      <label class="sw"><input id="desktopUA" type="checkbox"><span class="sl"></span></label>
    </div>
    <div class="row">
      <div>
        <div class="lbl">Kunci Anti Pinch-Zoom</div>
        <div class="hint">Cegah zoom tak sengaja saat geser</div>
      </div>
      <label class="sw"><input id="noZoom" type="checkbox"><span class="sl"></span></label>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="lbl">Skala Konten</div>
      <div class="val" id="sval">100%</div>
    </div>
    <input id="srng" type="range" min="80" max="150" step="5" value="100">
    <div class="presets">
      <button class="pbtn sbtn" data-s="90">90%</button>
      <button class="pbtn sbtn" data-s="100">100%</button>
      <button class="pbtn sbtn" data-s="115">115%</button>
      <button class="pbtn sbtn" data-s="130">130%</button>
    </div>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:8px">
      <div>
        <div class="lbl">Zoom Browser (Opsional)</div>
        <div class="hint">Khusus jika Situs Desktop browser aktif</div>
      </div>
      <div class="val" id="zval">Auto</div>
    </div>
    <div class="presets">
      <button class="pbtn zbtn" data-z="0">Auto</button>
      <button class="pbtn zbtn" data-z="150">150%</button>
      <button class="pbtn zbtn" data-z="200">200%</button>
      <button class="pbtn zbtn" data-z="250">250%</button>
    </div>
  </div>

  <button class="btn" id="btnApply">Terapkan &amp; Reload Spotify</button>
  <div class="st" id="st"></div>

  <script src="popup.js"></script>
</body>
</html>
